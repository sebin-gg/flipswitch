name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: 'python -m pip install --only-binary :all: --require-hashes -r requirements-lock.txt'
      - name: E2E suite
        run: python -m unittest test_e2e.py -v

  demo-smoke:
    name: demo smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: 'python -m pip install --only-binary :all: --require-hashes -r requirements-lock.txt'
      - name: Run the embedded demo from a fresh clone
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone -q . "$tmp/repo"
          git -C "$tmp/repo" config user.name "Switch CI"
          git -C "$tmp/repo" config user.email "ci@switch.local"
          cd "$tmp/repo"
          before="$(git rev-parse HEAD)"
          python main.py --simulate
          test -n "$(ls docs/adr/0002-*.md)"
          git log -1 --pretty=%s | grep -q "docs(adr): record ADR-0002"
          test "$(git rev-parse HEAD)" != "$before"
          git diff --name-status "$before" HEAD | grep -q '^A.*docs/adr/0002-'
